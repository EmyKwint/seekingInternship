<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seekingInternship</title>
    <script type="module" src="src/js/main.js" defer></script>
    <link href="src/css/style.css" rel="stylesheet">
</head>
<body>
        <header class="hero" id="hero">
                <h1>Recherche de Stage</h1>
        </header>

        <section class="screen" id="screen">

            <div class="program" id="program">
                <div class="program__head">
                    <div class="program__title">
                        <h3>seekingInternship.html</h3>
                        <img class="program-exit" 
                             src="assets/img/icons/24x24/actions/application-exit.png"
                             alt="program's close button">
                    </div>
                    <div class="program__score">
                        <p>Demandes envoyées : <span id="score">0</span></p>
                        <p class="gain">+<span id="gain"></span>/secondes</p>
                    </div>
                </div>
                
                <div class="program__body">
                    <aside class="program__aside">
                        <div class="program__energy">
                            <p>Energie : <span id="energy">100</span>%</p>
                        </div>
                        <div class="program__response">
                            <p>Réponses : <span id="response">0</span></p>
                        </div>
                        <div class="program__clickZone">
                            <button id="sendRequest">Envoyer une demande de stage</button>
                            <button id="takeBreak">Prendre une pause café</button>
                        </div>
                    </aside>
                    <div class="program__content" id="content"></div>
                </div>    
            </div>

            <footer>
                <button class="reset" id="reset">RESET</button>
            </footer>

        </section>

        <section class="templates">
            <div class="modal" id="modal">
                <div class="program__title">
                    <h4>L'abus de café peut nuire à la santé !</h4>
                </div>
                <div class="modal__body">
                    <div class="modal__content">
                        <div class="modal__content-icon">
                            <img src="assets/img/icons/24x24/places/dialog-error.png"
                                 alt="window error logo"
                                 class="dialog-horror">
                        </div>
                        <div class="modal__content-txt">
                            <p>Ton compteur est remis à 0 après une semaine d'hospitalisation...</p>
                            <p>Ne pas dépasser 300% !</p>
                        </div>
                    </div>
                    <div class="modal__btn">
                        <button id="modalBtn">D'accord</button>
                    </div>
                </div>
            </div>

            <div class="itw" id="itw">
                <h3 id="itwTitle"></h3>
                <p id="itwQuestion"></p>
            <div id="itwResponses"></div>
    </div>
        </section>
</body>
</html>
